<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="t d" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <title id="t">How to hold the phone when you tap RECENTER</title>
  <desc id="d">Left: seen from the side, a person faces the laptop and holds the phone straight up in front of their chest, with the screen facing them. Right: what the person sees, the phone upright with the thumb tapping RECENTER.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#d9480f"/></marker>
  </defs>
  <rect width="960" height="520" rx="16" fill="#f6f7fb"/>
  <rect x="16" y="16" width="560" height="488" rx="12" fill="#ffffff" stroke="#d8dce8"/>
  <rect x="592" y="16" width="352" height="488" rx="12" fill="#ffffff" stroke="#d8dce8"/>
  <text x="36" y="52" font-size="22" font-weight="700" fill="#1d2233">Seen from the side</text>
  <text x="612" y="52" font-size="22" font-weight="700" fill="#1d2233">What you see</text>

  <!-- floor -->
  <line x1="36" y1="464" x2="556" y2="464" stroke="#aeb4c6" stroke-width="3"/>

  <!-- what the webcam sees -->
  <path d="M478 170 112 150 112 330 300 330z" fill="#2f9e44" opacity=".12"/>
  <path d="M478 170 112 150M478 170 300 330" stroke="#2f9e44" stroke-width="2" stroke-dasharray="7 6" fill="none"/>

  <!-- person, facing right -->
  <g fill="#5b6c9e">
    <rect x="112" y="292" width="24" height="172" rx="11"/>
    <rect x="142" y="292" width="24" height="172" rx="11"/>
    <rect x="108" y="176" width="62" height="136" rx="24"/>
  </g>
  <circle cx="140" cy="134" r="36" fill="#f2c9a5"/>
  <path d="M106 128a36 36 0 0 1 62-25c-16 4-34 8-44 26-6 3-12 3-18-1z" fill="#3b2f2a"/>
  <circle cx="160" cy="130" r="3.6" fill="#1d2233"/>
  <!-- arm -->
  <path d="M142 200 188 278 262 244" fill="none" stroke="#f2c9a5" stroke-width="19" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- phone from the side: the blue edge is the screen, facing the person -->
  <rect x="268" y="150" width="11" height="116" rx="4" fill="#1d2233"/>
  <rect x="265" y="154" width="4" height="108" rx="2" fill="#339af0"/>
  <circle cx="272" cy="240" r="13" fill="#f2c9a5"/>

  <!-- eyes to screen -->
  <line x1="170" y1="132" x2="258" y2="178" stroke="#d9480f" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#arrow)"/>

  <!-- laptop on a table -->
  <rect x="384" y="326" width="166" height="9" rx="3" fill="#8a6f52"/>
  <rect x="404" y="335" width="9" height="129" fill="#8a6f52"/>
  <rect x="522" y="335" width="9" height="129" fill="#8a6f52"/>
  <rect x="400" y="316" width="104" height="10" rx="4" fill="#59617a"/>
  <path d="M504 322 478 170" stroke="#2c3247" stroke-width="10" stroke-linecap="round"/>
  <circle cx="478" cy="170" r="6" fill="#2f9e44" stroke="#ffffff" stroke-width="2"/>

  <!-- labels, left -->
  <text x="222" y="92" font-size="17" font-weight="600" fill="#d9480f">Phone straight up,</text>
  <text x="222" y="113" font-size="17" font-weight="600" fill="#d9480f">screen facing you</text>
  <line x1="274" y1="120" x2="274" y2="145" stroke="#d9480f" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="196" y="388" font-size="16" fill="#1d2233">In front of your chest,</text>
  <text x="196" y="409" font-size="16" fill="#1d2233">elbow bent</text>
  <line x1="240" y1="372" x2="266" y2="282" stroke="#d9480f" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="372" y="112" font-size="16" font-weight="600" fill="#2b8a3e">The webcam must see</text>
  <text x="372" y="133" font-size="16" font-weight="600" fill="#2b8a3e">your shoulders and hand</text>
  <text x="467" y="360" font-size="15" fill="#1d2233" text-anchor="middle">Laptop</text>

  <!-- phone from the front -->
  <text x="768" y="90" font-size="16" font-weight="600" fill="#d9480f" text-anchor="middle">Top of the phone points up</text>
  <line x1="768" y1="134" x2="768" y2="102" stroke="#d9480f" stroke-width="3" marker-end="url(#arrow)"/>
  <!-- palm behind the phone, fingers wrapping the left edge -->
  <path d="M676 330q-14 56 22 124h126q24-52 22-132z" fill="#f2c9a5"/>
  <g fill="#e8b98f">
    <rect x="672" y="262" width="40" height="23" rx="11"/>
    <rect x="668" y="290" width="44" height="24" rx="12"/>
    <rect x="668" y="319" width="44" height="24" rx="12"/>
    <rect x="672" y="348" width="40" height="22" rx="11"/>
  </g>
  <rect x="696" y="140" width="144" height="284" rx="18" fill="#1d2233"/>
  <rect x="704" y="150" width="128" height="264" rx="11" fill="#0d0b16"/>
  <text x="712" y="170" font-size="10.5" font-weight="600" fill="#7dffb0">connected to game</text>
  <rect x="711" y="179" width="114" height="62" rx="9" fill="#2a2140" stroke="#ffb35c" stroke-width="2"/>
  <text x="768" y="215" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">RECENTER</text>
  <rect x="711" y="249" width="114" height="104" rx="9" fill="#171127" stroke="#5a4d78" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="768" y="306" font-size="13" font-weight="700" fill="#d9d2ee" text-anchor="middle">MOVE</text>
  <rect x="711" y="361" width="114" height="44" rx="6" fill="#120e20"/>
  <!-- thumb reaching RECENTER -->
  <path d="M850 408C848 350 834 290 814 240" fill="none" stroke="#e8b98f" stroke-width="27" stroke-linecap="round"/>
  <path d="M850 408C848 350 834 290 814 240" fill="none" stroke="#f2c9a5" stroke-width="21" stroke-linecap="round"/>
  <text x="612" y="214" font-size="16" font-weight="600" fill="#d9480f">Tap</text>
  <text x="612" y="235" font-size="16" font-weight="600" fill="#d9480f">here</text>
  <line x1="652" y1="212" x2="706" y2="212" stroke="#d9480f" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="768" y="484" font-size="15" fill="#1d2233" text-anchor="middle">Either hand works.</text>
</svg>
